name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC; 08:00 UTC is midnight PST.
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    # Requires a repo-scoped self-hosted runner with label `openwiki`
    # that can reach the ZimaOS LiteLLM gateway.
    runs-on: [self-hosted, openwiki]
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki via LiteLLM failover
        # openwiki-chat = Gemini 2.5 Flash → Groq Llama 3.3 70B → OpenRouter Qwen free
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: http://192.168.1.121:4000/v1
          OPENWIKI_MODEL_ID: openwiki-chat

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update via LiteLLM `openwiki-chat`
            (Gemini → Groq → OpenRouter free failover) on self-hosted runner.
