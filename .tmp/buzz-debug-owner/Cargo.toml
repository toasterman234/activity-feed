[package]
name = "buzz-debug-ws2"
version = "0.1.0"
edition = "2021"

[dependencies]
nostr = "0.37"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rustls = { version = "0.23", features = ["ring"] }
